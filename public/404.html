<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting…</title>
  <meta http-equiv="refresh" content="0; url=/bridgeai-job-matching/" />
  <script>
    // SPA GitHub Pages fallback: redirect to repo base and preserve path
    (function(){
      var base = '/bridgeai-job-matching/';
      var cleanPath = location.pathname.replace(base, '');
      var dest = base + cleanPath + location.search + location.hash;
      location.replace(dest);
    })();
  </script>
</head>
<body>
  <p>Redirecting to the app… If you are not redirected, <a href="/bridgeai-job-matching/">click here</a>.</p>
</body>
</html>
